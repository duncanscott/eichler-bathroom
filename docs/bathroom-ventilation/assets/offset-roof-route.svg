<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
<title id="title">Offset REC54 with an above-roof duct route</title><desc id="desc">Concept only. Air rises from the shower grille through a flashed penetration, travels along a supported, insulated and weather-protected duct above the roof, then turns upward into the bottom of a REC54 mounted on a custom curb and inlet enclosure. This is not a manufacturer-approved assembly drawing.</desc>
