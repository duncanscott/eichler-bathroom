<g font-family="Arial,sans-serif" fill="#243e37"><text x="80" y="116" font-size="17" font-weight="bold">Bathroom grille stays here</text><text x="80" y="140" font-size="13" fill="#596861">Flashed penetration above the shower</text><path d="M208 155v48l23 33" fill="none" stroke="#89947f"/>
<text x="366" y="102" font-size="17" font-weight="bold">Short duct across the roof</text><text x="366" y="125" font-size="13" fill="#596861">Insulated, supported and weather-protected</text><path d="M507 141v46" stroke="#89947f" fill="none"/>
<text x="870" y="203" font-size="16" font-weight="bold">REC54</text><text x="870" y="225" font-size="13" fill="#596861">Air enters below</text><text x="870" y="268" font-size="14" font-weight="bold">Custom curb /</text><text x="870" y="288" font-size="14" font-weight="bold">inlet enclosure</text><path d="M863 270h-24" stroke="#89947f" fill="none"/>
<text x="347" y="422" font-size="14">Actual duct length matters for sound and airflow.</text><text x="347" y="446" font-size="13" fill="#596861">At least 4 ft from grille to fan if relying on the remote-fan sound exception.</text><text x="62" y="477" font-size="11" letter-spacing="2">BATHROOM / SHOWER</text>
</g>
