    <text x="428" y="423" font-size="16">2–3 ft straight before elbow in Panasonic’s guide</text>
    <text x="428" y="448" font-size="16" fill="#596861">Dashed underside: removable inspection panel.</text>
    <text x="428" y="473" font-size="16" fill="#596861">Final depth must accommodate duct and bend.</text>
    <path d="M950 350H991M950 192H991M980 198V344" stroke="#7b8278" stroke-width="1.5" fill="none" marker-end="url(#dimension)"/>
    <text x="1005" y="213" font-size="14" fill="#596861" transform="rotate(90 1005 213)">Finished drop: to be designed</text>
    <rect x="36" y="504" width="1008" height="36" rx="3" fill="#e7ece1"/>
    <text x="52" y="528" font-size="16">Air travels through the grille, fan and sealed duct. The surrounding enclosure is outside the exhaust path.</text>
  </g>
