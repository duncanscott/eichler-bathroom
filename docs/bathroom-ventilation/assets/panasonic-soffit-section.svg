    <path d="M55 165H809V191H55ZM881 165H1025V191H881Z" fill="url(#wood)"/>
    <path d="M55 137H803V126H810M880 126H888V137H1025" fill="none" stroke="#567668" stroke-width="5"/>
    <path d="M94 191V334H958V191" fill="#f0eee6" stroke="#b0b7a9" stroke-width="3"/>
    <path d="M95 192H808M882 192H957" fill="none" stroke="#31594c" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M119 194V326M377 194V237" stroke="#ad7d59" stroke-width="15"/>
