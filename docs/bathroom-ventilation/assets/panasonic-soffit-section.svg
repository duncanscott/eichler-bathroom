    <rect x="188" y="229" width="62" height="34" rx="3" fill="#c4cec2"/>
    <circle cx="283" cy="276" r="32" fill="#eef1e9" stroke="#8a9e8d" stroke-width="2"/>
    <path d="M275 249Q316 268 281 282Q252 300 269 314" fill="none" stroke="#879c8a" stroke-width="5"/>
    <path d="M375 274H791Q845 274 845 220V119" fill="none" stroke="#a3b39f" stroke-width="60"/>
    <path d="M375 274H791Q845 274 845 220V119" fill="none" stroke="#fffcf7" stroke-width="40"/>
    <path d="M373 247V301M409 247V301" stroke="#6e8576" stroke-width="3"/>
    <path d="M804 126V116H886V126M796 115 810 99H880L894 115Z" fill="#c3d0bf" stroke="#567668" stroke-width="2"/>
    <path d="M824 104 814 90M866 104 876 90" stroke="#31594c" stroke-width="2" marker-end="url(#air)"/>
    <path d="M440 274H596M676 274H760M845 209V163" fill="none" stroke="#31594c" stroke-width="3" marker-end="url(#air)"/>
    <rect x="158" y="331" width="240" height="15" fill="#fafaf5" stroke="#6e8576" stroke-width="2"/>
    <path d="M174 338H190M201 338H217M228 338H244M255 338H271M282 338H298M309 338H325M336 338H352M363 338H379" stroke="#6e8576" stroke-width="2"/>
    <path d="M160 328H176M377 328H397" stroke="#31594c" stroke-width="5"/>
