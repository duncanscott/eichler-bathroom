<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">Panasonic FV-0510VS1 in a shallow indoor soffit</title>
  <desc id="desc">Not-to-scale design concept: the fan is supported inside a closed soffit below the wood ceiling, with its grille underneath. A sealed side duct runs straight before turning up through the roof to a suitable weatherproof termination. The box around the fan is outside the exhaust path. Roof insulation, air sealing, access and actual dimensions require design.</desc>
  <defs>
    <pattern id="wood" width="50" height="22" patternUnits="userSpaceOnUse"><rect width="50" height="22" fill="#bb8a63"/><path d="M0 20H50M10 8H32" stroke="#9c6f4f" stroke-width="1"/></pattern>
    <pattern id="insulation" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#e3dec2"/><path d="m0 12 12-12" stroke="#c7c2a4" stroke-width="1"/></pattern>
    <marker id="air" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#31594c"/></marker>
    <marker id="dimension" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse"><path d="M6 0 0 3 6 6" fill="none" stroke="#7b8278"/></marker>
  </defs>
  <rect width="1080" height="560" rx="4" fill="#fffcf7"/>
  <g font-family="Arial, sans-serif" fill="#243e37">
    <text x="36" y="34" font-size="14" letter-spacing="2">SIDE SECTION · CONCEPT ONLY · NOT TO SCALE</text>
    <text x="36" y="80" font-size="20" font-weight="bold">Existing roof and wood ceiling</text>
    <text x="36" y="106" font-size="16" fill="#596861">Maintain insulation and air sealing; repair unused cutout.</text>
    <text x="704" y="62" font-size="18" font-weight="bold">Suitable roof termination</text>
    <text x="704" y="86" font-size="15" fill="#596861">Flashing, insulation and bend detail by roofer</text>
