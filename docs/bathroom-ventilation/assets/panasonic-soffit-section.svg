    <path d="M102 392 182 311" stroke="#7b8278" fill="none"/>
    <text x="36" y="421" font-size="18" font-weight="bold">Fan body: 3⅜″ deep</text>
    <text x="36" y="446" font-size="16">13″ removable grille below</text>
    <text x="36" y="472" font-size="16" fill="#596861">Seal flange to finished underside.</text>
    <path d="M417 355V375M792 355V375M422 365H787" stroke="#7b8278" stroke-width="1.5" fill="none"/>
