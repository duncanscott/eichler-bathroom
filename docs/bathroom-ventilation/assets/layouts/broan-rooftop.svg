<title id="title">Broan fan in a custom rooftop enclosure</title><desc id="desc">Conceptual cutaway, not to scale. An indoor fan occupies an insulated enclosure above the roof; a sealed vertical duct reaches a roof cap, and the fan grille stays at the ceiling.</desc>
