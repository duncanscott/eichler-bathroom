<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img" aria-labelledby="title desc">
  <title id="title">Compact Panasonic fan enclosure with exposed custom duct</title>
  <desc id="desc">One design option, not to scale: a small enclosure surrounds the FV-0510VS1 and its connection, with the original grille beneath. Smooth fabricated duct remains visible from the side outlet to an upward roof connection. There is no continuous soffit around the duct. Final dimensions, duct section, supports, finish, insulation and roof details remain to be designed.</desc>
  <defs>
    <pattern id="wood" width="60" height="24" patternUnits="userSpaceOnUse"><rect width="60" height="24" fill="#bd926e"/><path d="M0 22H60M8 8H40" stroke="#a57a58" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#31594c"/></marker>
  </defs>
  <rect width="1080" height="590" rx="4" fill="#fffcf7"/>
  <g font-family="Arial, sans-serif" fill="#243e37">
    <text x="36" y="35" font-size="14" letter-spacing="1.5">COMPACT-COVER OPTION · SIDE SECTION · NOT TO SCALE</text>
    <text x="36" y="81" font-size="20" font-weight="bold">Compact fan cover + visible finished duct</text>
    <text x="36" y="109" font-size="16" fill="#596861">Light finish shown for discussion; material and colour remain open.</text>
    <text x="716" y="80" font-size="17" font-weight="bold">Roof termination</text>
    <text x="716" y="106" font-size="15" fill="#596861">Verify flashing and existing opening.</text>
